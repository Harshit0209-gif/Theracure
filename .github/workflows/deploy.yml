name: Deploy Theracure Dashboard

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Utho Cloud via SSH
        uses: appleboy/ssh-action@master
        with:
          host: 157.20.214.173
          username: root
          key: ${{ secrets.UTHO_INSTANCE_PRIVAT_KEY }}
          script: |
            cd /var/www/html/Theracure-Dashboard
            git pull origin main
            export DATABASE_URL="postgresql://theracure:theracure%40123@157.20.214.173:5432/theracuredb"
            pnpm install
            pnpm build
            pnpm prisma migrate deploy
            pm2 startOrRestart /var/www/html/ecosystem.config.js --only dashboard
            pm2 status
