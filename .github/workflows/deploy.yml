name: Dashboard Deploy (Staged)

on:
  push:
    branches: [main]

jobs:
  pull:
    name: Pull latest code
    runs-on: ubuntu-latest
    steps:
      - name: Pull code on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /var/www/theracure/Theracure-Dashboard
            git fetch origin
            git reset --hard origin/main

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: pull
    steps:
      - name: Build image on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /var/www/theracure/Theracure-Dashboard

            docker stop dashboard || true
            docker rm dashboard || true

            docker images -q theracure-dashboard | xargs -r docker rmi -f

            docker build -t theracure-dashboard:latest .

  run:
    name: Run container
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Run dashboard container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            docker run -d \
            --name dashboard \
            --env-file /var/www/theracure/.env.dashboard \
            -p 3001:3001 \
            --restart unless-stopped \
            --shm-size=1g \
            theracure-dashboard:latest

  healthcheck:
    name: Stability check
    runs-on: ubuntu-latest
    needs: run
    steps:
      - name: Verify container health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            echo "🔍 Checking container status..."
            docker ps | grep dashboard

            echo "📜 Checking container logs for errors..."
            docker logs --tail 20 dashboard

            echo ""
            echo "⏳ Waiting for application to be ready..."

            # Retry curl up to 12 times (60 seconds total)
            for i in {1..12}; do
              echo "Attempt $i/12: Testing http://127.0.0.1:3001/login"
              if curl -f -s http://127.0.0.1:3001/login > /dev/null 2>&1; then
                echo "✅ Application is responding!"
                break
              fi
              if [ $i -eq 12 ]; then
                echo "❌ Application failed to respond after 60 seconds"
                echo "📜 Full container logs:"
                docker logs dashboard
                exit 1
              fi
              sleep 5
            done

            echo ""
            echo "📱 Verifying SMS worker is running..."
            docker exec dashboard ps aux | grep -E "sms-worker.js" | grep -v grep || {
              echo "❌ SMS worker not found!"
              echo "📜 Container logs:"
              docker logs dashboard
              exit 1
            }

            echo "✅ SMS worker is running"

            echo ""
            echo "📜 Recent container logs:"
            docker logs --tail 50 dashboard

            echo ""
            echo "✅ All health checks passed!"
