name: Deploy Theracure

on:
  push:
    branches:
      - main

jobs:
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Deploy Frontend via SSH
        uses: appleboy/ssh-action@master
        with:
          host: 157.20.214.173
          username: root
          key: ${{ secrets.UTHO_INSTANCE_PRIVAT_KEY }}
          script: |
            set -e

            cd /var/www/theracure/Theracure-Frontend
            git pull origin main
            npm install
            npm run build

            cd /var/www/theracure
            pm2 reload mstheracure-frontend

            pm2 save
            pm2 status

  deploy-dashboard:
    name: Deploy Dashboard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Deploy Dashboard via SSH
        uses: appleboy/ssh-action@master
        with:
          host: 157.20.214.173
          username: root
          key: ${{ secrets.UTHO_INSTANCE_PRIVAT_KEY }}
          script: |
            set -e

            echo "${{ secrets.DEPLOY_KEY }}" > /root/.ssh/github_deploy_key
            chmod 600 /root/.ssh/github_deploy_key

            cd /var/www/theracure/Theracure-Dashboard

            GIT_SSH_COMMAND="ssh -i /root/.ssh/github_deploy_key -o StrictHostKeyChecking=no" \
              git pull origin main

            export DATABASE_URL="${{ secrets.DATABASE_URL }}"
            export NEXTAUTH_URL="${{ secrets.NEXTAUTH_URL }}"
            export NEXTAUTH_SECRET="${{ secrets.NEXTAUTH_SECRET }}"
            export JWT_SECRET="${{ secrets.JWT_SECRET }}"
            export NODE_ENV=production
            export UTHO_ACCESS_KEY="${{ secrets.UTHO_ACCESS_KEY }}"
            export UTHO_SECRET_KEY="${{ secrets.UTHO_SECRET_KEY }}"
            export UTHO_REGION="${{ secrets.UTHO_REGION }}"
            export UTHO_S3_BUCKET_NAME="${{ secrets.UTHO_S3_BUCKET_NAME }}"
            export UTHO_ENDPOINT="${{ secrets.UTHO_ENDPOINT }}"
            export UTHO_CDN="${{ secrets.UTHO_CDN }}"
            export MSG91_AUTH_KEY="${{ secrets.MSG91_AUTH_KEY }}"
            export URL_EXPIRY_SECONDS="${{ secrets.URL_EXPIRY_SECONDS }}"

            pnpm install
            pnpm prisma generate
            pnpm run generate:enums
            pnpm build
            pnpm prisma migrate deploy
            pnpm exec puppeteer browsers install chrome

            cd /var/www/theracure
            pm2 reload mstheracure-dashboard --env production

            pm2 save
            pm2 status
