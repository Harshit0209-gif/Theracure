name: Deploy Theracure Dashboard

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Utho Cloud via SSH
        uses: appleboy/ssh-action@master
        with:
          host: 157.20.214.173
          username: root
          key: ${{ secrets.UTHO_INSTANCE_PRIVAT_KEY }}
          script: |
            set -e

            echo "💾 Saving deploy private key for Git pull"
            echo "${{ secrets.DEPLOY_KEY }}" > /root/.ssh/github_deploy_key
            chmod 600 /root/.ssh/github_deploy_key

            echo "🎯 Switching to project directory"
            cd /var/www/html/Theracure-Dashboard

            echo "📥 Pulling latest code from Git using GIT_SSH_COMMAND"
            GIT_SSH_COMMAND="ssh -i /root/.ssh/github_deploy_key -o StrictHostKeyChecking=no" git pull origin main

            echo "🔐 Exporting all environment variables from GitHub Secrets"
            export DATABASE_URL="${{ secrets.DATABASE_URL }}"
            export NEXTAUTH_URL="${{ secrets.NEXTAUTH_URL }}"
            export NEXTAUTH_SECRET="${{ secrets.NEXTAUTH_SECRET }}"
            export JWT_SECRET="${{ secrets.JWT_SECRET }}"
            export UTHO_ACCESS_KEY="${{ secrets.UTHO_ACCESS_KEY }}"
            export UTHO_SECRET_KEY="${{ secrets.UTHO_SECRET_KEY }}"
            export UTHO_REGION="${{ secrets.UTHO_REGION }}"
            export UTHO_S3_BUCKET_NAME="${{ secrets.UTHO_S3_BUCKET_NAME }}"
            export UTHO_ENDPOINT="${{ secrets.UTHO_ENDPOINT }}"
            export UTHO_CDN="${{ secrets.UTHO_CDN }}"
            export MSG91_AUTH_KEY="${{ secrets.MSG91_AUTH_KEY }}"
            export NODE_ENV="production"

            echo "📦 Installing dependencies"
            pnpm install

            echo "⚙️ Generating Prisma client"
            pnpm prisma generate

            echo "🔧 Generating TypeScript enums"
            pnpm run generate:enums

            echo "⚙️ Building the application"
            pnpm build

            echo "🗄️ Running Prisma migrations"
            pnpm prisma migrate deploy || { echo "❌ Error: Failed to deploy Prisma migrations. Exiting."; exit 1; }

            echo "🧑‍💻 Installing Puppeteer Chrome"
            pnpm exec puppeteer browsers install chrome || { echo "❌ Error: Failed to install Chrome for Puppeteer. Exiting."; exit 1; }

            echo "🚀 Restarting application with PM2"
            pm2 startOrRestart /var/www/html/ecosystem.config.js --env production --only dashboard

            echo "✅ PM2 status check"
            pm2 status

            echo "🎉 Deployment complete!"
