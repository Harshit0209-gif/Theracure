name: Secure Dashboard Deploy (systemd)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_DIR: /var/www/theracure/Theracure-Dashboard
  SERVICE_NAME: theracure
  APP_PORT: 3001

jobs:
  security-scan:
    name: Security Scan (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      - name: Run npm audit
        run: |
          echo "🔍 Running security audit..."
          pnpm audit --audit-level=high || true
          pnpm audit --json > audit-report.json || true

      - name: Check for suspicious packages
        run: |
          echo "🔍 Checking for packages with install scripts..."
          # List all packages with postinstall, preinstall, or install scripts
          find node_modules -name package.json -exec grep -l "postinstall\|preinstall\|install\":" {} \; | head -20 || true

      - name: Display audit results
        run: |
          echo "🔍 NPM Audit Results:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ -f audit-report.json ]; then
            cat audit-report.json | jq -r '.vulnerabilities // "No critical vulnerabilities"' || cat audit-report.json
          else
            echo "No audit report generated"
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Upload audit report
        if: false
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: security-audit
          path: audit-report.json
          retention-days: 1
          if-no-files-found: warn

  deploy:
    name: Deploy to Server via systemd
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Deploy and verify
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            APP_DIR=/var/www/theracure/Theracure-Dashboard
            SERVICE_NAME=theracure
            APP_PORT=3001

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Starting Deployment"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━"

            cd $APP_DIR

            echo "Pulling latest code..."
            git fetch origin
            git reset --hard origin/main

            echo "Activating Node version from .nvmrc..."
            export NVM_DIR="$HOME/.nvm"
            . "$NVM_DIR/nvm.sh"
            nvm install
            nvm use
            echo "Using Node $(node --version)"

            echo "Enabling pnpm..."
            npm install -g corepack@latest
            corepack enable

            echo "Installing dependencies..."
            pnpm install --frozen-lockfile

            echo "Building production bundle..."
            pnpm build

            echo "Preparing standalone runtime assets..."
            cp -r .next/static .next/standalone/.next/static
            cp -r public .next/standalone/public

            echo "Restarting systemd service..."
            sudo systemctl daemon-reload
            sudo systemctl restart $SERVICE_NAME

            echo "Waiting for service startup..."
            sleep 10

            echo "Verifying service status..."
            sudo systemctl status $SERVICE_NAME --no-pager
            sudo systemctl is-active $SERVICE_NAME

            echo "Verifying port binding..."
            ss -tulnp | grep ":${APP_PORT}"

            echo "Checking HTTP health endpoint..."
            curl -f http://127.0.0.1:${APP_PORT}/login

            echo "Checking Node processes..."
            ps aux | grep node | grep -v grep

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Deployment Successful"
            echo "Service: $SERVICE_NAME"
            echo "Port: $APP_PORT"
            echo "Time: $(date)"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━"
